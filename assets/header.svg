  <rect x="76" y="72" width="6" height="146" rx="3" fill="url(#accent)" opacity="0.95"></rect>

  <text x="98" y="122" font-size="48" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" fill="#F5F3FF" font-weight="850">
