<svg width="1200" height="290" viewBox="0 0 1200 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Amet Marcelo Header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D28D9"></stop>
      <stop offset="55%" stop-color="#1b0f2f"></stop>
      <stop offset="100%" stop-color="#0B0B10"></stop>
    </linearGradient>

    <radialGradient id="glow" cx="30%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.60"></stop>
      <stop offset="45%" stop-color="#7C3AED" stop-opacity="0.18"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"></feDropShadow>
