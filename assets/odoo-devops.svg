<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">Odoo delivery and runtime architecture</title>
<desc id="desc">Illustrative flow: Git commits trigger CI checks, a Docker build and deployment to Odoo. Users connect through HTTPS and a reverse proxy. Odoo accesses PostgreSQL and persistent attachments. Moving dots represent delivery and requests, not live metrics.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#6457a6}.label{font-size:19px;font-weight:700}.small{font-size:13px}.card{fill:#8870da;fill-opacity:.07;stroke:#9474dc;stroke-width:1.5}.link{fill:none;stroke:#9474dc;stroke-width:2;stroke-opacity:.55}.packet{fill:#20a786}@media(prefers-color-scheme:dark){text{fill:#c4b5fd}.card{fill-opacity:.12}.packet{fill:#34d399}}@media(prefers-reduced-motion:reduce){.packet{display:none}}</style>
<text x="26" y="28" class="small" letter-spacing="3">ODOO / DELIVERY + RUNTIME</text>
<g class="link"><path d="M200 100H260M450 100H510M700 100H790V191"/><path d="M200 230H260M450 230H700M885 230H910V318H860M790 269V318H650"/></g>
<g class="packet">
<circle r="5"><animateMotion dur="6s" repeatCount="indefinite" path="M200 100H260H450H510H700H790V191"/></circle>
<circle r="5"><animateMotion dur="4s" repeatCount="indefinite" path="M200 230H260H450H700"/></circle>
<circle r="5"><animateMotion dur="3s" repeatCount="indefinite" path="M790 269V318H650"/></circle>
<circle r="5"><animateMotion dur="3.5s" repeatCount="indefinite" path="M885 230H910V318H860"/></circle>
</g>
<g class="card"><rect x="25" y="60" width="175" height="80" rx="12"/><rect x="260" y="60" width="190" height="80" rx="12"/><rect x="510" y="60" width="190" height="80" rx="12"/><rect x="25" y="191" width="175" height="78" rx="12"/><rect x="260" y="191" width="190" height="78" rx="12"/><rect x="700" y="191" width="185" height="78" rx="12"/><rect x="480" y="293" width="170" height="56" rx="10"/><rect x="690" y="293" width="170" height="56" rx="10"/></g>
<g text-anchor="middle"><text x="112" y="92" class="label">Git repository</text><text x="112" y="119" class="small">Python · XML · QWeb</text><text x="355" y="92" class="label">CI / validation</text><text x="355" y="119" class="small">Lint · tests · checks</text><text x="605" y="92" class="label">Build + deploy</text><text x="605" y="119" class="small">Docker image · release</text><text x="112" y="223" class="label">Users</text><text x="112" y="248" class="small">Browser · HTTPS</text><text x="355" y="223" class="label">Reverse proxy</text><text x="355" y="248" class="small">TLS · routing</text><text x="792" y="223" class="label">Odoo</text><text x="792" y="248" class="small">ERP · custom addons</text><text x="565" y="317" class="label">PostgreSQL</text><text x="565" y="336" class="small">Business data</text><text x="775" y="317" class="label">Filestore</text><text x="775" y="336" class="small">Persistent attachments</text></g>
